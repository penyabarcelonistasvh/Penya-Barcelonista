name: Preparar proposta de portada optimitzada
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  proposta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Generar i verificar abans de proposar
        run: |
          python3 scripts/generar-portada-optimizada.py
          python3 scripts/verificar-candidat-portada.py
      - name: Preparar branca aillada
        run: |
          set -euo pipefail
          BRANCH="optimitzacio/portada-imatges-externes"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "La branca de proposta ja existeix. No se sobreescriu."
            exit 0
          fi
          git switch -c "$BRANCH"
          cp dist/portada-optimitzada/index.html index.html
          mkdir -p assets/optimized
          cp dist/portada-optimitzada/assets/optimized/* assets/optimized/
          git add index.html assets/optimized/
          git diff --cached --check
          git commit -m "Optimitzar portada: externalitzar 11 imatges sense alterar contingut"
          git push --set-upstream origin "$BRANCH"
          echo "Branca creada. El Pull Request es gestiona separadament."
