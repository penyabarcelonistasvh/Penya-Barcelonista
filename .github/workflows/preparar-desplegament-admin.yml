name: Preparar desplegament Cloudflare admin
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar codi
        run: |
          cp cloudflare/worker.js /tmp/worker.mjs
          node --check /tmp/worker.mjs
      - name: Comprovar configuracio actual sense modificar-la
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import os,json,urllib.request
          url='https://api.cloudflare.com/client/v4/accounts/'+os.environ['CF_ACCOUNT']+'/workers/scripts/pbsv-admin/settings'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['CF_TOKEN']})
          with urllib.request.urlopen(req) as r: data=json.load(r)
          assert data.get('success'), 'Consulta fallida'
          bindings={b['name']:b['type'] for b in data['result'].get('bindings',[])}
          required={'ADMIN_DB':'d1','PUSH_SERVICE':'service','PUSH_INTERNAL_TOKEN':'secret_text','GITHUB_CLIENT_SECRET':'secret_text','SESSION_KEY':'secret_text'}
          for name,kind in required.items():
              if bindings.get(name)!=kind: raise SystemExit('Revisar vinculació '+name)
          if 'GITHUB_CLIENT_ID' not in bindings: raise SystemExit('Falta GITHUB_CLIENT_ID')
          print('Vinculacions requerides presents. Cap canvi desplegat.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pbsv-admin-worker-source
          path: cloudflare/worker.js
